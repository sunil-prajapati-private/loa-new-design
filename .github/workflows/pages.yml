name: Test and deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out demo source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test demo decisions
        run: npm test
      - name: Build for the GitHub Pages path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Verify browser journeys at the Pages path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          LOA_DEMO_BROWSER_CHANNEL: bundled
        run: |
          npm run preview -- --base "${PAGES_BASE_PATH}/" > /tmp/loa-demo-preview.log 2>&1 &
          loa_demo_preview_pid=$!
          trap 'kill "$loa_demo_preview_pid" 2>/dev/null || true' EXIT
          export LOA_DEMO_URL="http://127.0.0.1:4178${PAGES_BASE_PATH}/"
          for loa_demo_attempt in {1..30}; do
            if curl --fail --silent "$LOA_DEMO_URL" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$LOA_DEMO_URL" > /dev/null
          npm run test:browser
      - name: Upload tested static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
